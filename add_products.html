async function addAll() {
  let count = 0;
  for (const p of products) {
    await db.collection("smart_products").doc(p.id).set({
      name: p.name,
      batches: [{ date: "2026-05-30", qty: 1 }]
    });
    count++;
    document.getElementById('status').innerText = `تم إضافة ${count}/${products.length}: ${p.name}`;
  }
  document.getElementById('status').innerText = `✅ تم إضافة ${count} منتج بنجاح!`;
}

addAll();
</script>
