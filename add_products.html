const log = document.getElementById(‘log’);

async function addAll() {
let count = 0;
for (const p of products) {
try {
const doc = await db.collection(“smart_products”).doc(p.id).get();
if (doc.exists) {
log.innerHTML += `<div style="color:#94a3b8">⏭ موجود: ${p.name}</div>`;
} else {
await db.collection(“smart_products”).doc(p.id).set({
name: p.name,
batches: [{ date: “2026-05-30”, qty: 1 }]
});
log.innerHTML += `<div class="ok">✅ تم: ${p.name}</div>`;
count++;
}
} catch(e) {
log.innerHTML += `<div class="err">❌ فشل: ${p.name}</div>`;
}
}
document.getElementById(‘status’).innerHTML = `<span class="ok">✅ خلص! تم إضافة ${count} منتج جديد</span>`;
}

addAll();
</script>
